<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Insights - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-book-quran"></i>
                <span>Quran Insights</span>
            </div>
            <div class="theme-switch">
                <button id="theme-toggle" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <header class="hero">
        <h1>Explore the Divine Wisdom</h1>
        <p>Summaries, Lessons, and Messages from every Surah of the Holy Quran.</p>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Search by Surah name or number...">
        </div>
    </header>

    <main class="container">
        <div class="stats-overview">
            <div class="stat-card">
                <span id="completed-count">0</span>
                <p>Surahs Completed</p>
            </div>
            <div class="stat-card">
                <span id="bookmarked-count">0</span>
                <p>Bookmarked</p>
            </div>
        </div>

        <div id="surah-grid" class="surah-grid">
            <!-- Surah cards will be injected here -->
            <div class="loader">Loading Surahs...</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Quran Insights. Adhering to Islamic Principles.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
