<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Cancellation Tracker</title>
    <link rel="stylesheet" href="static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Flight Cancellation Agent</h1>
        <p>Real-time monitoring: Toronto, Amsterdam, Doha, Bangalore</p>
    </header>

    <main>
        <section class="stats-container">
            <div class="card">
                <h3>Cancellations by Airport</h3>
                <canvas id="airportChart"></canvas>
            </div>
            <div class="card">
                <h3>Top 5 Airlines (Cancellations)</h3>
                <canvas id="airlineChart"></canvas>
            </div>
        </section>

        <section class="filters card">
            <h2>Filters</h2>
            <div class="filter-group">
                <label for="airportFilter">Airport:</label>
                <select id="airportFilter">
                    <option value="">All Airports</option>
                    <option value="YYZ">Toronto (YYZ)</option>
                    <option value="AMS">Amsterdam (AMS)</option>
                    <option value="DOH">Doha (DOH)</option>
                    <option value="BLR">Bangalore (BLR)</option>
                </select>

                <label for="airlineFilter">Airline:</label>
                <input type="text" id="airlineFilter" placeholder="e.g. Air Canada">

                <label for="startDate">From:</label>
                <input type="date" id="startDate">

                <label for="endDate">To:</label>
                <input type="date" id="endDate">

                <button id="applyFilters">Apply Filters</button>
            </div>
        </section>

        <section class="table-container card">
            <h2>Cancelled Flights</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Flight #</th>
                            <th>Airline</th>
                            <th>Airport</th>
                            <th>Scheduled Time</th>
                            <th>Reason</th>
                        </tr>
                    </thead>
                    <tbody id="cancellationTable">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="static/js/main.js"></script>
</body>
</html>
