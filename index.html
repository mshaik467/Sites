<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prophets of Islam Quiz for Kids</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 Prophets Quiz 🌟</h1>
            <div class="stats">
                <div id="level-display">Level: 1</div>
                <div id="score-display">Score: 0</div>
            </div>
        </header>

        <main id="quiz-container">
            <div id="start-screen" class="screen">
                <h2>Welcome, Little Scholar!</h2>
                <p>Learn about the wonderful Prophets of Allah through this fun quiz.</p>
                <button id="start-btn">Start Quiz</button>
            </div>

            <div id="question-screen" class="screen hidden">
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                <h3 id="level-title">Level 1: Beginner</h3>
                <div id="question-text"></div>
                <div id="options-container" class="hidden"></div>
                <div id="fill-container" class="hidden">
                    <input type="text" id="fill-input" placeholder="Type your answer here...">
                    <button id="submit-fill">Submit</button>
                </div>
                <div id="feedback" class="hidden"></div>
                <button id="next-btn" class="hidden">Next Question</button>
            </div>

            <div id="result-screen" class="screen hidden">
                <h2>Mabrouk! 🎉</h2>
                <p id="final-score"></p>
                <div id="result-message"></div>
                <button id="restart-btn">Play Again</button>
            </div>
        </main>

        <footer>
            <p>Adhering to Islamic Principles • Based on Quran & Hadith</p>
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
